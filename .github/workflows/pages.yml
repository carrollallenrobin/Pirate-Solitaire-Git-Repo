name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          editor_zip="${RUNNER_TEMP}/godot.zip"
          templates_tpz="${RUNNER_TEMP}/templates.tpz"

          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$editor_zip" \
            "${release}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  ${editor_zip}" | sha256sum --check

          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$templates_tpz" \
            "${release}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  ${templates_tpz}" | sha256sum --check

          mkdir -p "${HOME}/.local/bin" \
            "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$editor_zip" -d "${RUNNER_TEMP}/godot"
          install -m 755 \
            "${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            "${HOME}/.local/bin/godot"
          unzip -q "$templates_tpz" -d "${RUNNER_TEMP}/godot-templates"
          mv "${RUNNER_TEMP}/godot-templates/templates/"* \
            "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Add Godot to PATH
        run: echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 \
            libgl1 \
            libx11-6 \
            libxcursor1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1

      - name: Export Web
        run: |
          set -euo pipefail
          godot --headless --path . --import --quit || true
          mkdir -p build/web
          godot --headless --path . --export-release "Web" "${GITHUB_WORKSPACE}/build/web/index.html"
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
